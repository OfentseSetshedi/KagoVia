                </a>

                <a href="Supplier.html">

                <a href="teams.html">

                        <defs>
                            <mask id="SVGKI5kpbjS">
                                <g fill="none">
                                    <path fill="#fff" stroke="#fff" stroke-linejoin="round" stroke-width="4" d="M24 44a19.94 19.94 0 0 0 14.142-5.858A19.94 19.94 0 0 0 44 24a19.94 19.94 0 0 0-5.858-14.142A19.94 19.94 0 0 0 24 4A19.94 19.94 0 0 0 9.858 9.858A19.94 19.94 0 0 0 4 24a19.94 19.94 0 0 0 5.858 14.142A19.94 19.94 0 0 0 24 44Z" />

                                </g>

                        </defs>

                <button id="Premium-plan">
                    <img src="/KagoBuild/frontend/assets/icons/Premium-icon.svg" alt="Settings" width="17" height="17">

            </div>

        </aside>

        <div class="sidebar-resizer" id="sidebarResizer">

        </div>

        <main class="dashboard-overview">

            <!-- =========================================================
                Dashboard Header
                This is the top navigation bar of the dashboard.
            ========================================================== -->

            <header class="dashboard-header">

                <!-- ==========================================
                    LEFT SIDE
                    Dashboard Title
                =========================================== -->
                <div class="header-left">
                    <h2>Dashboard Overview</h2>
                </div>


                <!-- ==========================================
                    RIGHT SIDE
                    Search + Notification + User Profile
                =========================================== -->
                <div class="header-right">

                    <!-- ==========================
                        Search Container
                        Holds the search icon and
                        the search input.
                    =========================== -->

                    <div class="search-container">

                        <!-- Search Icon -->
                        <span class="search-icon">
                            <img src="/KagoBuild/frontend/assets/icons/search.svg" alt=""     width="27" height="27">
                        </span>

                        <!-- Search Input -->
                        <input
                            type="search"
                            placeholder="Search projects..."
                        >

                    </div>


                    <!-- ==========================
                        Notification Button
                    =========================== -->

                    <button class="notification-btn">

                        <img src="/KagoBuild/frontend/assets/icons/notification.svg" alt=""     width="25" height="25">

                        <!-- Notification Badge -->
                        <span class="notification-count">
                            5
                        </span>

                    </button>



                    <!-- ==========================
                        User Profile Section
                    =========================== -->

                    <div class="profile-section">

                        <!-- User Image -->
                        <img
                            src="images/profile.jpg"
                            alt="Profile Picture"
                        >

                        <!-- User Information -->
                        <div class="user-details">

                            <h4>Moses</h4>

                            <p>Estimator</p>

                        </div>


                        <!-- Dropdown Arrow -->
                        <span class="dropdown-arrow">

                            ▼

                        </span>

                    </div>

                </div>

            </header>


            
        </main>
    </section>


    <script>

        const sidebar = document.querySelector(".dashboard-navbar");
        const resizer = document.getElementById("sidebarResizer");

        let dragging = false;

        resizer.addEventListener("mousedown", () => {

            dragging = true;

            document.body.style.cursor = "ew-resize";

        });

        document.addEventListener("mouseup", () => {

            dragging = false;

            document.body.style.cursor = "default";

        });

        document.addEventListener("mousemove",(e)=>{

            if(!dragging) return;

            let width = e.clientX;

            if(width < 70)
                width = 70;

            if(width > 320)
                width = 320;

            sidebar.style.width = width + "px";

            if(width <= 85){

                sidebar.classList.add("collapsed");

            }else{

                sidebar.classList.remove("collapsed");

            }

        });

    </script>

</body>
</html>
