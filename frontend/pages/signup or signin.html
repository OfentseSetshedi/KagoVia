<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
     <link rel="stylesheet" href="../styles/global.css">
</head>
<body>
    <section id="sign-in-up">

        <div class="left-container">
            <img src="../assets/images/home-hero.png"
            alt=""       width="100%" height="540px">
        </div>

        <div class="right-container">

            <div class="right-container-sign-up">
                <form action="" method="" id="form-sign-up">

                    <div class="form-group">    
                        <h1>Get Started</h1>
                        <p>Welcome to KagoBuild — Let's get started</p>
                    </div>
                    <div class="form-group">
                        <label for="">Full name:</label>
                        <input type="text" placeholder="Full name">
                    </div>
                    <div class="form-group">
                        <label for="Email">Email address:</label>
                        <input type="email" name="" id="" placeholder="Email">
                    </div>
                    <div class="form-group">
                        <label for="Password">Password</label>
                        <input type="password" name="" id="" placeholder="Password">
                    </div>
                    <div class="form-group">
                        <label for="password">Confirm password</label>
                        <input type="password" name="" id="" placeholder="Confirm password">
                    </div>
                    
                    <button>Create new account</button>
                    
                    <div class="form-group">
                        <p>Already have account? <span>Login</span></p>
                    </div>
                    <div class="form-group"> 
                        <p>Terms Of Use | Privacy Policy</p>
                    </div>

                </form>
            </div>

        </div>
        

    </section>
</body>
</html>
