<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Projects</title>
        <link rel="stylesheet" href="../styles/dash.css">
        <link rel="stylesheet" href="../styles/projects.css">
</head>
<body>
    <section class="dashboard">

        <aside class="dashboard-navbar">
            <div class="upper-sidebar">
                <div id="logo"><span class="sidebar-icon">
                    <img src="../assets/images/home-hero.png"
                    alt="logo-image"
                    width="30"
                    height="30">
                </span>logo</div>
                <button id="dashboard" >
                    <svg width="17" height="17" viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="7" height="7" rx="1" stroke="currentColor" stroke-width="1.6"/><rect x="14" y="3" width="7" height="7" rx="1" stroke="currentColor" stroke-width="1.6"/><rect x="3" y="14" width="7" height="7" rx="1" stroke="currentColor" stroke-width="1.6"/><rect x="14" y="14" width="7" height="7" rx="1" stroke="currentColor" stroke-width="1.6"/></svg>
                    Dashboard
                </button>
                
                <button id="Projects">
                    <svg width="17" height="17" viewBox="0 0 24 24" fill="none">
                    <path
                        d="M7 4H17L20 7V20H4V7L7 4Z"
                        stroke="currentColor"
                        stroke-width="1.6"
                        stroke-linejoin="round"
                    />

                        d="M8 12L10 10L12 13L15 9L16 10"
                        stroke="currentColor"
                        stroke-width="1.6"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    />
                    <path
                        d="M8 8H12"
                        stroke="currentColor"
                        stroke-width="1.6"
                        stroke-linecap="round"
                    />
                    </svg>
                    Projects
                </button>
                
                <a href="ai-design.html">
                <button id="AI-Design">
                    
                        <svg width="17" height="17" viewBox="0 0 24 24" fill="none">
                        <circle
                            cx="12"
                            cy="12"
                            r="8"
                            stroke="currentColor"
                            stroke-width="2"
                        />
                        <circle
                            cx="12"
                            cy="12"
                            r="2"
                            fill="currentColor"
                        />
                        <path
                            d="M12 3V5"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                        />
                        </svg>
                        AI Design
                    

                </button>
                </a>
                <button id="Material">
                    <svg width="17" height="17" viewBox="0 0 24 24" fill="none">
                    <path d="M12 2 21 7 12 12 3 7 12 2Z"
                            stroke="currentColor" stroke-width="1.6"/>
                    <path d="M3 7v10l9 5 9-5V7"
                            stroke="currentColor" stroke-width="1.6"/>
                    <path d="M12 12v10"
                            stroke="currentColor" stroke-width="1.6"/>
                    </svg>
                    Material
                </button>
                
                <button id="Cost-Estimator">
                    <svg width="17" height="17" viewBox="0 0 24 24" fill="none">
                    <rect x="5" y="2" width="14" height="20" rx="2"
                            stroke="currentColor" stroke-width="1.6"/>
                    <rect x="8" y="5" width="8" height="3"
                            stroke="currentColor" stroke-width="1.6"/>
                    <circle cx="9" cy="13" r="1" fill="currentColor"/>
                    <circle cx="15" cy="13" r="1" fill="currentColor"/>
                    <circle cx="9" cy="17" r="1" fill="currentColor"/>
                    <circle cx="15" cy="17" r="1" fill="currentColor"/>
                    </svg>
                    Cost Estimator
                </button>
                
                <button id="Reports">
                    <svg width="17" height="17" viewBox="0 0 24 24" fill="none"><path d="M6 2h9l5 5v15H6z"stroke="currentColor" stroke-width="1.6"/><path d="M15 2v5h5"stroke="currentColor" stroke-width="1.6"/><path d="M9 13h6M9 17h4"stroke="currentColor" stroke-width="1.6"/></svg>
                    Reports
                </button>
                
                <button id="Suppliers">
                    <svg width="17" height="17" viewBox="0 0 24 24" fill="none"><rect x="3" y="7" width="18" height="13" rx="2"stroke="currentColor" stroke-width="1.6"/><path d="M9 7V5h6v2M3 12h18" stroke="currentColor" stroke-width="1.6"/></svg>
                    Suppliers
                </button>
                
                <button id="Teams">
                    <svg width="17" height="17" viewBox="0 0 24 24" fill="none">
                    <circle cx="9" cy="8" r="3"
                            stroke="currentColor" stroke-width="1.6"/>
                    <circle cx="17" cy="10" r="2"
                            stroke="currentColor" stroke-width="1.6"/>
                    <path d="M3 20c0-3 3-5 6-5s6 2 6 5"
                            stroke="currentColor" stroke-width="1.6"/>
                    <path d="M15 20c0-2 1-3 3-4"
                            stroke="currentColor" stroke-width="1.6"/>
                    </svg>
                    Teams
                </button>
                
                <button id="Settings"> 
                    <svg width="17" height="17" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="3"stroke="currentColor" stroke-width="2"/><path d="M19.4 15A1.65 1.65 0 0 0 21 12A1.65 1.65 0 0 0 19.4 9L18.9 8.1A1.65 1.65 0 0 0 16.7 6.6L15.8 6.1A1.65 1.65 0 0 0 12.5 5H11.5A1.65 1.65 0 0 0 8.2 6.1L7.3 6.6A1.65 1.65 0 0 0 5.1 8.1L4.6 9A1.65 1.65 0 0 0 3 12A1.65 1.65 0 0 0 4.6 15L5.1 15.9A1.65 1.65 0 0 0 7.3 17.4L8.2 17.9A1.65 1.65 0 0 0 11.5 19H12.5A1.65 1.65 0 0 0 15.8 17.9L16.7 17.4A1.65 1.65 0 0 0 18.9 15.9L19.4 15Z"stroke="currentColor"stroke-width="1.6"/></svg>
                    Settings
                </button>

            </div>

            <div class="lower-sidebar">
                <button id="need-help">
                    <svg width="17" height="17" viewBox="0 0 24 24" fill="none">
  <path
    d="M4 15V12C4 7.58172 7.58172 4 12 4C16.4183 4 20 7.58172 20 12V15"
    stroke="currentColor"
    stroke-width="1.6"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <rect
    x="2.5"
    y="13.5"
    width="4"
    height="6"
    rx="1.8"
    stroke="currentColor"
    stroke-width="1.6"
  />
  <rect
    x="17.5"
    y="13.5"
    width="4"
    height="6"
    rx="1.8"
    stroke="currentColor"
    stroke-width="1.6"
  />
  <path
    d="M20 19.5V20.2C20 21.7464 18.7464 23 17.2 23H14.5"
    stroke="currentColor"
    stroke-width="1.6"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <circle cx="13" cy="23" r="1.4" stroke="currentColor" stroke-width="1.6"/>
                    </svg>
                    need help
                </button>

                <button id="Premium-plan">
                    <svg width="17" height="17" viewBox="0 0 24 24" fill="none">
                    <path
                        d="M4 9L8 12L12 5L16 12L20 9L18.5 18H5.5L4 9Z"
                        stroke="currentColor"
                        stroke-width="1.6"
                        stroke-linejoin="round"
                    />
                    <path
                        d="M5.5 18H18.5"
                        stroke="currentColor"
                        stroke-width="1.6"
                        stroke-linecap="round"
                    />
                    <circle cx="4" cy="8" r="1.3" stroke="currentColor" stroke-width="1.4"/>
                    <circle cx="12" cy="4" r="1.3" stroke="currentColor" stroke-width="1.4"/>
                    <circle cx="20" cy="8" r="1.3" stroke="currentColor" stroke-width="1.4"/>
                    </svg>
                    Premium plan
                </button>
            </div>

        </aside>

        <div class="sidebar-resizer" id="sidebarResizer">
        </div>

        <main class="dashboard-overview">

            <!-- =========================================================
                Dashboard Header
                This is the top navigation bar of the dashboard.
            ========================================================== -->

            <header class="dashboard-header">

                <!-- ==========================================
                    LEFT SIDE
                    Dashboard Title
                =========================================== -->
                <div class="header-left">
                    <h2>Projects </h2>
                </div>


                <!-- ==========================================
                    RIGHT SIDE
                    Search + Notification + User Profile
                =========================================== -->
                <div class="header-right">

                    <!-- ==========================
                        Search Container
                        Holds the search icon and
                        the search input.
                    =========================== -->

                    <div class="search-container">

                        <!-- Search Icon -->
                        <span class="search-icon">
                            🔍
                        </span>

                        <!-- Search Input -->
                        <input
                            type="search"
                            placeholder="Search projects..."
                        >

                    </div>


                    <!-- ==========================
                        Notification Button
                    =========================== -->

                    <button class="notification-btn">

                        🔔

                        <!-- Notification Badge -->
                        <span class="notification-count">
                            5
                        </span>

                    </button>



                    <!-- ==========================
                        User Profile Section
                    =========================== -->

                    <div class="profile-section">

                        <!-- User Image -->
                        <img
                            src="images/profile.jpg"
                            alt="Profile Picture"
                        >

                        <!-- User Information -->
                        <div class="user-details">

                            <h4>Moses</h4>

                            <p>Estimator</p>

                        </div>


                        <!-- Dropdown Arrow -->
                        <span class="dropdown-arrow">

                            ▼

                        </span>

                    </div>

                </div>

            </header>

            
            <div class="main-card">
                <!--
                ========================================================== 
                Projects header buttons
                ========================================================== 
                -->
                <div class="Projects-filter-btn">
                    <div class="Projects-filters">
                        <button class="Filter-by-Status-btn" >Filter by Status  ▼  </button>
                        <button class="Filter-by-Budget-btn" >Filter by Budget  ▼ </button>
                        <button class="Filter-by-Style-btn" >Filter by Style   ▼ </button>
                    </div>

                    <button class="New-Project-btn"> + New Project</button>
                </div>
                <!--
                ========================================================== 
                Projects table
                ========================================================== 
                -->
                <div class="Projects-current-list">
                    <table>
                        <thead>
                            <tr>
                                <th>Project Name</th>                                
                                <th>Status</th>
                                <th>Budget</th>
                                <th>Progress</th>
                                <th>Last Updated</th>
                            </tr>
                        </thead>

                        <tbody>
                            <tr>
                                <td>
                                    <div class="project-fav-icon"></div>
                                    <div class="project-picture-icon"></div>
                                    <div class="Project-names">
                                        <h2 class="project-style"></h2>
                                        <p class="project-types">• <span>320</span>m²</p>
                                        
                                    </div>
                                </td>
                                <td>
                                    <div> 
                                        <button class="status-btn">● Active </button>
                                    </div>
                                </td>
                                <td>
                                    <p>R <span class="project-amount">5.3</span>M<span id="Amount-in-digits-sign"></span></p>
                                </td>
                                <td>
                                    <progress></progress>
                                </td>
                                <td>
                                    <div>
                                        <div class="last-UpdatebyWhom">
                                            <p><span class="last-update-date"> 22 May 2024</span> by <span class="who-updated"> Arjun Mehta</span></p>
                                        </div>
                                        <button class="more-about-the-project">...</button>
                                    </div>
                                </td>

                            </tr>
                        </tbody>
                    </table>
                </div>
                <!--
                ========================================================== 
                ========================================================== 
                -->
                <div class="Projects-details">
                    <header class="Projects-detailes-header">
                        <div class="item">
                            <button class="next-btn-icon">←</button>
                            <h4>Modern Villa </h4> <button class="status">● Active</button>
                            <br>
                            <p>
                                <span>Residential</span> •<span> 320</span> m² • Created on <span>10 May 2024</span>
                            </p>
                        </div>

                        <div class="options-buttons">
                            <button class="share-btn">
                                share
                            </button>
                            <button class="Edit-Project-btn">
                                Edit Project
                            </button>
                            <button class="more">
                                ...
                            </button>
                        </div>
                        <div class="project-nav">
                            <button>Overview</button>
                            <button>Design</button>
                            <button>Materials</button>
                            <button>Suppliers</button>
                            <button>Budget</button>
                            <button>Reports</button>
                            <button>Settings</button>
                        </div>
                    </header>
                    <section id="project-contents">

                        <div class="Project-Summary">

                        </div>

                        <div class="Project-Overview">

                        </div>

                        <div class="Recent-Activity">

                        </div>
                        <div class="Budget-Overview">

                        </div>

                        <!--
                    ========================================================== 
                    ========================================================== 
                    -->
                    <div class="Design-Preview"></div>

                    <div class="Project-checklist"></div>

                    </section>

                    

                    

                </div>
            </div> 
            
        </main>
    </section>




    
    <section class="Projects"></section>
    <section class="AI-Design"></section>
    <section class="Material"></section>
    <section class="Cost-Estimator"></section>
    <section class="Reports"></section> 
    <section class="Suppliers"></section>
    <section class="Teams"></section>
    <section class="Settings"></section>
    <section class="need-help"></section>
    <section class="Premium-plan"></section>


  

</body>
</html>
