<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BuildWise Dashboard</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    display:flex;
    background:#f4f7fb;
}

/* =========================
    Sidebar
========================= */

.sidebar{
    width:240px;
    height:100vh;
    background:#071B38;
    position:fixed;
    left:0;
    top:0;
    padding:25px 20px;
}

.logo{
    color:white;
    font-size:28px;
    font-weight:bold;
    margin-bottom:40px;
}

.nav-links{
    display:flex;
    flex-direction:column;
    gap:10px;
}

.nav-links a{

    text-decoration:none;
    color:white;
    padding:15px;
    border-radius:10px;
    transition:.3s;
}

.nav-links a:hover{
    background:#114fa8;
}

.nav-links a.active{
    background:#0b63ff;
}

/* =========================
    Main Content
========================= */

.main{

    margin-left:240px;
    width:calc(100% - 240px);
}

header{

    background:white;
    padding:20px 40px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    box-shadow:0 2px 10px rgba(0,0,0,.08);

}

header input{

    width:300px;
    padding:10px;
    border:1px solid #ccc;
    border-radius:8px;

}

.content{

    padding:40px;

}

.cards{

    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:20px;

}

.card{

    background:white;
    padding:30px;
    border-radius:15px;
    box-shadow:0 2px 10px rgba(0,0,0,.08);

}

.card h3{

    margin-bottom:10px;

}

.card p{

    color:#777;

}

</style>

</head>
<body>

<!-- Sidebar -->

<aside class="sidebar">

    <div class="logo">
        BuildWise
    </div>

    <nav class="nav-links">

        <a href="index.html" class="active">
            Dashboard
        </a>

        <a href="projects.html">
            Projects
        </a>

        <a href="materials.html">
            Materials
        </a>

        <a href="cost-estimator.html">
            Cost Estimator
        </a>

        <a href="reports.html">
            Reports
        </a>

        <a href="suppliers.html">
            Suppliers
        </a>

        <a href="team.html">
            Team
        </a>

        <a href="settings.html">
            Settings
        </a>

    </nav>

</aside>

<!-- Main -->

<div class="main">

<header>

    <h2>Dashboard</h2>

    <input type="text" placeholder="Search...">

</header>

<div class="content">

<h2>Welcome Back 👋</h2>

<br>

<div class="cards">

    <div class="card">
        <h3>Projects</h3>
        <p>12 Active Projects</p>
    </div>

    <div class="card">
        <h3>Materials</h3>
        <p>154 Materials Available</p>
    </div>

    <div class="card">
        <h3>Reports</h3>
        <p>8 Reports Generated</p>
    </div>

</div>

</div>

</div>

</body>
</html>
